<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ALTWEB Editor — write markdown beautifully, export it as a signed context capsule."
    />
    <!-- Social card. Shared capsule links are #hash SPAs, so scrapers only see
         this static head — one generic branded card for every shared capsule. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://capsule.altweb.software/" />
    <meta property="og:site_name" content="ALTWEB" />
    <meta property="og:title" content="ALTWEB Editor" />
    <meta
      property="og:description"
      content="Write markdown, export a signed context capsule — a file, URL, or QR. Verify before you inject."
    />
    <meta property="og:image" content="https://capsule.altweb.software/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ALTWEB — Signed context capsules for AI agents. Verify before you inject."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://capsule.altweb.software/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>ALTWEB Editor</title>
    <!-- Blocking on purpose: must run before first paint. External (not
         inline) so the .htaccess CSP can stay script-src 'self'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
