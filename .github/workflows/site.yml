# ALTWEB docs site — GitHub Pages deploy.
#
# NOTE: manual-only. The live site deploys via cPanel (archives built from
# site/dist), so Pages is not enabled on this repo — running this on push
# just failed with a red X on every commit touching site/**. Kept as a
# ready-made alternative: enable Pages in Settings, then trigger by hand.
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build (site/ is standalone, not an npm workspace)
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
