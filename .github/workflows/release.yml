name: Release (npm, with provenance)

# Publishes to npm WITH provenance attestations - the published package
# carries a verifiable link back to this repo, this workflow, and the exact
# commit. For a provenance tool, publishing without provenance was the one
# missing piece (and directory scanners penalize it).
#
# Auth: npm Trusted Publishing (OIDC) - configure once per package on
# npmjs.com (package Settings -> Trusted Publisher -> GitHub Actions:
# repository danielsoimu/altweb, workflow release.yml). No token to store.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        options:
          - altweb-context
          - altweb
          - both

permissions:
  contents: write # create the matching GitHub release + tag after publish
  id-token: write # OIDC - required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Update npm
        # Node 22 bundles npm 10; the OIDC trusted-publishing token exchange
        # exists only in npm >= 11.5 - with npm 10 the PUT goes out
        # unauthenticated and the registry masks it as E404.
        run: npm install -g npm@latest
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish altweb-context
        if: ${{ inputs.package == 'altweb-context' || inputs.package == 'both' }}
        run: npm publish --provenance --access public -w altweb-context
      - name: Publish altweb
        if: ${{ inputs.package == 'altweb' || inputs.package == 'both' }}
        run: npm publish --provenance --access public -w altweb
      # GitHub release mirrors every npm publish so the repo's "Latest" can
      # never diverge from npm again. Tag convention: <package>-vX.Y.Z
      # (per-package versions diverge; a bare vX.Y.Z would lie about the rest).
      - name: GitHub release for altweb-context
        if: ${{ inputs.package == 'altweb-context' || inputs.package == 'both' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          gh release create "altweb-context-v$VERSION" --target "$GITHUB_SHA" \
            --title "altweb-context v$VERSION" --generate-notes \
            --notes "npm: https://www.npmjs.com/package/altweb-context/v/$VERSION (published with provenance attestations)"
      - name: GitHub release for altweb
        if: ${{ inputs.package == 'altweb' || inputs.package == 'both' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          gh release create "altweb-v$VERSION" --target "$GITHUB_SHA" \
            --title "altweb v$VERSION" --generate-notes \
            --notes "npm: https://www.npmjs.com/package/altweb/v/$VERSION (published with provenance attestations)"
